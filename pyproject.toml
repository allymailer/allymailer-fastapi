[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allymailer-fastapi"
version = "1.0.0"
description = "AllyMailer Web API for FastAPI: API client, webhooks"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AllyMailer" }]
keywords = ["allymailer", "fastapi", "email", "webhook"]
classifiers = ["Framework :: FastAPI"]
dependencies = ["allymailer-python-sdk>=1.0.0", "fastapi>=0.100"]

[project.urls]
Homepage = "https://github.com/allymailer/allymailer-fastapi"
Documentation = "https://docs.allymailer.com.ua/ua/web-api-ref"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
